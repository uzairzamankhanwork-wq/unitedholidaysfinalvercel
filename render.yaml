services:
  - type: web
    name: united-holidays-api
    runtime: node
    plan: starter
    region: oregon
    buildCommand: npm install && npm run build
    startCommand: npm run start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      # Set this to your deployed Vercel URL, e.g. https://united-holidays.vercel.app
      - key: FRONTEND_DOMAIN
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: united-holidays-db
          property: connectionString

databases:
  - name: united-holidays-db
    plan: starter
    region: oregon
    postgresMajorVersion: "16"
